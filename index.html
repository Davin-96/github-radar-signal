<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<meta name="description" content="GitHub 资源雷达 — 追踪星标飙升、热门趋势与优质开源项目的工作台式数据面板">
<title>GitHub 资源雷达 · Signal</title>
<style>
/* ============================================================
   THEME TOKENS — 主题即一组 CSS 变量覆盖（astryx 思路）
   ============================================================ */
:root{
  --radius:16px; --grid-unit:4px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease-spring:cubic-bezier(.34,1.4,.5,1);
  --ease-out:cubic-bezier(.22,.61,.36,1);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0f1a; --bg-2:#0d1422;
  --orb-1:#114a63; --orb-2:#2c2160; --orb-3:#0b4a4a;
  --grid-line:rgba(130,165,220,.05);
  --ink:#eef4ff; --ink-2:#d0dcf0; --muted:#9babca; --dim:#6a7e9f;
  --accent:#4fd8d2; --accent-2:#6fb3ff; --accent-3:#b39bff;
  --gold:#ffcc70; --rose:#ff7d95; --green:#5fe0a0;
  --glass-bg:rgba(22,32,52,.52); --glass-bg-2:rgba(28,40,64,.42);
  --glass-blur:22px; --glass-sat:1.5;
  --stroke:rgba(160,192,240,.16); --stroke-hi:rgba(180,210,255,.30);
  --hi-top:rgba(255,255,255,.22); --hi-left:rgba(255,255,255,.10);
  --thick-dark:rgba(0,0,0,.42); --edge-bottom:rgba(0,0,0,.30);
  --shadow:0 18px 44px rgba(0,0,0,.42);
  --chip-bg:rgba(150,185,235,.10); --chip-active-ink:#06121b;
  --track:rgba(150,185,235,.12);
  --hl-zh-bg:rgba(79,216,210,.075); --hl-zh-bar:rgba(79,216,210,.85);
  --hl-delta-bg:rgba(255,125,149,.13);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#e9eef6; --bg-2:#f3f6fb;
  --orb-1:#a9dfe4; --orb-2:#c9c2f2; --orb-3:#bfe6da;
  --grid-line:rgba(40,70,120,.055);
  --ink:#16233a; --ink-2:#2b3c56; --muted:#566984; --dim:#8494ad;
  --accent:#0f9e9a; --accent-2:#2f7fe0; --accent-3:#7c5cd6;
  --gold:#c07e0a; --rose:#cf3f5f; --green:#12845a;
  --glass-bg:rgba(255,255,255,.6); --glass-bg-2:rgba(255,255,255,.44);
  --glass-blur:26px; --glass-sat:1.7;
  --stroke:rgba(255,255,255,.78); --stroke-hi:rgba(255,255,255,.98);
  --hi-top:rgba(255,255,255,.94); --hi-left:rgba(255,255,255,.58);
  --thick-dark:rgba(28,45,80,.16); --edge-bottom:rgba(28,45,80,.14);
  --shadow:0 16px 40px rgba(28,48,84,.15);
  --chip-bg:rgba(255,255,255,.55); --chip-active-ink:#fff;
  --track:rgba(30,60,110,.10);
  --hl-zh-bg:rgba(15,158,154,.075); --hl-zh-bar:rgba(15,158,154,.9);
  --hl-delta-bg:rgba(207,63,95,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.55; min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .45s var(--ease-out),color .45s var(--ease-out);
}
.bg-fx{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(96px);opacity:.55;will-change:transform}
.orb.a{width:540px;height:540px;background:radial-gradient(circle,var(--orb-1),transparent 68%);top:-170px;left:-130px;animation:drift1 26s ease-in-out infinite}
.orb.b{width:580px;height:580px;background:radial-gradient(circle,var(--orb-2),transparent 68%);top:-90px;right:-170px;animation:drift2 32s ease-in-out infinite}
.orb.c{width:500px;height:500px;background:radial-gradient(circle,var(--orb-3),transparent 70%);bottom:-210px;left:34%;animation:drift3 38s ease-in-out infinite}
.grid-fx{position:absolute;inset:0;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 82% 62% at 50% 0%,#000 38%,transparent 100%)}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,60px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,80px)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-70px)}}

/* GLASS MATERIAL */
.g{
  position:relative;
  background:linear-gradient(155deg,var(--glass-bg),var(--glass-bg-2));
  border:1px solid var(--stroke);
  border-radius:var(--radius);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  box-shadow:inset 0 1px 0 var(--hi-top),inset 1px 0 0 var(--hi-left),inset 0 -1px 0 var(--edge-bottom),0 1px 0 var(--thick-dark),var(--shadow);
}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,var(--hi-left),transparent 22%);opacity:.5}
.wrap{max-width:1340px;margin:0 auto;padding:0 28px}

/* top nav */
header{position:sticky;top:0;z-index:50;padding:10px 0}
.navbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:11px 18px;border-radius:calc(var(--radius) + 2px);
  background:linear-gradient(160deg,var(--glass-bg),var(--glass-bg-2));
  border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(28px) saturate(var(--glass-sat));backdrop-filter:blur(28px) saturate(var(--glass-sat));
  box-shadow:inset 0 1px 0 var(--hi-top),inset 0 -1px 0 var(--edge-bottom),var(--shadow);
}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(79,216,210,.24),rgba(111,179,255,.14));
  border:1px solid rgba(79,216,210,.38);box-shadow:inset 0 1px 0 var(--hi-top),0 0 20px rgba(79,216,210,.18)}
.brand-mark svg{width:21px;height:21px}
.brand h1{font-size:17px;font-weight:650;letter-spacing:.3px}
.brand h1 span{color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:0 6px}
.status .pulse{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(95,224,160,.6);animation:pulse 2.4s infinite}
.status.warn .pulse{background:var(--gold);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,224,160,.5)}70%{box-shadow:0 0 0 9px rgba(95,224,160,0)}100%{box-shadow:0 0 0 0 rgba(95,224,160,0)}}
.btn{
  font-family:var(--font);font-size:12.5px;color:var(--ink);cursor:pointer;
  background:var(--chip-bg);border:1px solid var(--stroke);border-radius:999px;
  padding:7px 14px;display:inline-flex;align-items:center;gap:6px;
  transition:transform .35s var(--ease-spring),background .2s,border-color .2s;white-space:nowrap;
  box-shadow:inset 0 1px 0 var(--hi-top);text-decoration:none;
}
.btn:hover{background:var(--stroke);border-color:var(--stroke-hi);transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:wait}

/* hero 压缩为横向条 */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;padding:16px 0 14px}
@media(max-width:920px){.hero{grid-template-columns:1fr;gap:8px}}
.hero-copy{padding:4px 4px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:9px}
.eyebrow::before{content:"";width:22px;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
.hero h2{font-size:clamp(28px,3.8vw,44px);line-height:1.1;font-weight:700;letter-spacing:-.6px;margin-bottom:9px}
.hero h2 em{font-style:normal;background:linear-gradient(120deg,var(--accent),var(--accent-2) 55%,var(--accent-3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:14.5px;max-width:600px;line-height:1.7}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:14px 15px;border-radius:14px;min-height:88px;display:flex;flex-direction:column;justify-content:space-between}
.kpi::after{content:"";position:absolute;top:14px;left:0;width:2px;height:26px;border-radius:2px;background:linear-gradient(180deg,var(--accent),transparent)}
.kpi .k-label{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .k-val{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1.1}
.kpi .k-val small{font-size:11px;color:var(--dim);font-weight:400;margin-left:3px;font-family:var(--font)}

/* ===== WORKBENCH: 左侧分栏导航 + 右侧大主区 ===== */
.workbench{display:grid;grid-template-columns:224px 1fr;gap:18px;align-items:stretch;margin-top:6px}
@media(max-width:900px){.workbench{grid-template-columns:1fr}}
.rail{padding:14px 12px;display:flex;flex-direction:column;gap:16px;align-self:start}
@media(max-width:900px){.rail{gap:10px}}
.rail-group{display:flex;flex-direction:column;gap:5px}
@media(max-width:900px){.rail-group{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center}}
.rail-label{font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);padding:2px 10px 6px;display:flex;align-items:center;gap:8px}
.rail-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--stroke),transparent)}
.rail-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  font-family:var(--font);font-size:13.5px;color:var(--ink-2);
  padding:10px 12px;border-radius:12px;border:1px solid transparent;background:transparent;
  transition:transform .35s var(--ease-spring),background .2s,border-color .2s,color .2s;
}
.rail-item:hover{background:var(--chip-bg);transform:translateX(2px);color:var(--ink)}
.rail-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rail-item.active{
  color:var(--ink);font-weight:600;border-color:var(--stroke-hi);
  background:linear-gradient(135deg,color-mix(in srgb,var(--rc) 20%,transparent),var(--chip-bg));
  box-shadow:inset 0 1px 0 var(--hi-top),0 6px 16px rgba(0,0,0,.12);
}
.rail-item.active::before{content:"";position:absolute;left:0;width:3px;height:22px;border-radius:3px;background:var(--rc);box-shadow:0 0 12px var(--rc)}
.rail-item{position:relative}
.ri-ic{width:22px;text-align:center;font-size:15px;flex:none;filter:saturate(1.05)}
.ri-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-count{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--chip-bg);border:1px solid var(--stroke);padding:1px 8px;border-radius:999px}
.rail-item.active .ri-count{color:var(--ink);border-color:var(--stroke-hi)}

/* stage */
.stage{display:flex;flex-direction:column;min-height:0}
.stage-head{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--stroke);background:linear-gradient(180deg,rgba(127,160,210,.05),transparent)}
.stage-icon{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:21px;
  background:var(--chip-bg);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 var(--hi-top)}
.stage-title h2{font-size:20px;font-weight:680;letter-spacing:-.2px;line-height:1.2}
.stage-title p{font-size:12.5px;color:var(--muted);margin-top:2px}
.stage-count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--chip-bg);border:1px solid var(--stroke);padding:5px 12px;border-radius:999px;white-space:nowrap}
.stage-list{padding:16px;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:max-content;gap:12px;align-content:start}
@media(max-width:1180px){.stage-list{grid-template-columns:1fr}}
.stage-list .empty{color:var(--dim);padding:40px;text-align:center;grid-column:1/-1}

/* repo 大卡片 — 字体分区 + 高亮 */
.repo-card{
  display:grid;grid-template-columns:38px 1fr;gap:12px;padding:15px 16px;cursor:pointer;
  border:1px solid var(--stroke);border-radius:14px;
  background:linear-gradient(150deg,var(--glass-bg-2),transparent);
  transition:transform .35s var(--ease-spring),border-color .2s,background .2s,box-shadow .2s;
  min-height:132px;
}
.repo-card:hover{transform:translateY(-3px);border-color:var(--stroke-hi);box-shadow:inset 0 1px 0 var(--hi-top),0 12px 26px rgba(0,0,0,.18)}
.repo-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rc-rank{font-family:var(--mono);font-size:15px;color:var(--dim);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums;font-weight:600}
.repo-card:nth-child(-n+3) .rc-rank{color:var(--gold)}
.rc-main{min-width:0}
.rc-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rc-name{color:var(--accent-2);font-size:15px;font-weight:650;text-decoration:none;letter-spacing:.1px}
.rc-name:hover{color:var(--accent);text-decoration:underline}
.rc-stars{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.rc-line2{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:6px;min-height:20px}
.rc-delta{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--rose);background:var(--hl-delta-bg);border:1px solid color-mix(in srgb,var(--rose) 28%,transparent);padding:2px 9px;border-radius:7px;font-variant-numeric:tabular-nums}
.rc-tag{font-size:11.5px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);padding:2px 9px;border-radius:7px;font-weight:600}
.rc-desc-en{color:var(--muted);font-size:12.5px;margin-top:7px;line-height:1.55;max-height:39px;overflow:hidden}
.rc-desc-zh{
  color:var(--ink-2);font-size:13.5px;line-height:1.55;margin-top:8px;
  padding:6px 11px;border-left:3px solid var(--hl-zh-bar);border-radius:0 8px 8px 0;
  background:var(--hl-zh-bg);
  max-height:54px;overflow:hidden;
}
.rc-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:9px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.rc-lang{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.rc-lang i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--lc);box-shadow:0 0 8px var(--lc)}
.rc-topic{color:var(--dim)}
.rc-topic:hover{color:var(--accent-3)}

/* 趋势图浮层 */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;visibility:hidden;opacity:0;transition:opacity .3s var(--ease-out),visibility .3s}
.modal.open{visibility:visible;opacity:1}
.modal-backdrop{position:absolute;inset:0;background:rgba(4,8,16,.62);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.modal-card{position:relative;width:min(960px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(18px) scale(.98);transition:transform .4s var(--ease-spring)}
.modal.open .modal-card{transform:none}
.modal-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--stroke);background:linear-gradient(180deg,rgba(127,160,210,.05),transparent)}
.modal-title{display:flex;align-items:center;gap:10px;min-width:0}
.modal-title svg{width:20px;height:20px;flex:none;color:var(--accent)}
.modal-title span{font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
/* 弹层顶部项目简介 */
.modal-info{padding:18px 20px 16px;border-bottom:1px solid var(--stroke);background:linear-gradient(180deg,rgba(127,160,210,.045),transparent)}
.mi-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.mi-name{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.mi-link{font-family:var(--mono);font-size:12px;color:var(--accent-2);text-decoration:none}
.mi-link:hover{color:var(--accent);text-decoration:underline}
.mi-stats{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-left:auto;font-family:var(--mono);font-size:12.5px}
.mi-stats .s-star{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.mi-stats .s-fork{color:var(--accent-2);font-variant-numeric:tabular-nums}
.mi-stats .s-lang{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.mi-stats .s-lang i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--lc);box-shadow:0 0 8px var(--lc)}
.mi-desc-zh{color:var(--ink-2);font-size:14px;line-height:1.7;padding:9px 13px;border-left:3px solid var(--hl-zh-bar);border-radius:0 9px 9px 0;background:var(--hl-zh-bg);margin-bottom:9px}
.mi-desc-en{color:var(--muted);font-size:13px;line-height:1.65}
.mi-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.mi-tags .mi-tag{font-size:11.5px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);padding:3px 10px;border-radius:7px;font-weight:600}
.mi-tags .mi-topic{font-family:var(--mono);font-size:11.5px;color:var(--dim);background:var(--chip-bg);border:1px solid var(--stroke);padding:3px 10px;border-radius:7px}
.mi-empty{color:var(--dim);font-size:13px;font-style:italic}

.modal-body{padding:18px;overflow:auto;min-height:120px}
.chart-frame{border:1px solid var(--stroke);border-radius:12px;overflow:hidden;display:grid;place-items:center;min-height:300px;background:var(--glass-bg-2)}
.chart-img{width:100%;height:auto;display:block}
:root[data-theme="dark"] .chart-img{filter:invert(1) hue-rotate(180deg)}
.chart-placeholder{color:var(--dim);font-size:13px;padding:40px}
.chart-err{color:var(--muted);text-align:center;padding:44px;font-size:13px}

/* 悬浮趋势图预览（hover 仓库名触发） */
.hover-chart{
  position:fixed;z-index:80;width:430px;max-width:calc(100vw - 32px);pointer-events:none;
  padding:12px;border-radius:14px;
  background:linear-gradient(155deg,var(--glass-bg),var(--glass-bg-2));
  border:1px solid var(--stroke-hi);
  -webkit-backdrop-filter:blur(26px) saturate(var(--glass-sat));backdrop-filter:blur(26px) saturate(var(--glass-sat));
  box-shadow:inset 0 1px 0 var(--hi-top),inset 0 -1px 0 var(--edge-bottom),0 20px 48px rgba(0,0,0,.42);
  opacity:0;visibility:hidden;transform:translateY(8px) scale(.97);
  transition:opacity .18s var(--ease-out),transform .28s var(--ease-spring),visibility .18s;
}
.hover-chart.show{opacity:1;visibility:visible;transform:none}
.hc-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--stroke)}
.hc-name{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.hc-hint{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
.hc-body{min-height:64px;display:grid;place-items:center}
.hc-body .chart-img{width:100%;height:auto;display:block}
:root[data-theme="dark"] .hc-body .chart-img{filter:invert(1) hue-rotate(180deg)}
.hc-loading{font-size:12px;color:var(--dim);padding:24px 10px;text-align:center}

/* view 定义：榜单 + 分类，统一走一套渲染 */
const CATS=["texts","ai","dev","life","finance"];
const CAT_META={texts:{icon:"📝",color:"var(--accent)"},ai:{icon:"🤖",color:"var(--accent-3)"},dev:{icon:"🛠️",color:"var(--accent-2)"},life:{icon:"☯️",color:"var(--green)"},finance:{icon:"💰",color:"var(--gold)"}};
const BOARDS=[
 {id:"trendingDaily",label:"trendingDailyTitle",sub:"trendingDailySub",icon:"⚡",color:"var(--rose)",get:()=>DATA.trending_daily||[],dk:"period_stars"},
 {id:"trendingWeekly",label:"trendingWeeklyTitle",sub:"trendingWeeklySub",icon:"📅",color:"var(--accent-3)",get:()=>DATA.trending_weekly||[],dk:"period_stars"},
 {id:"topStars",label:"topStarsTitle",sub:"topStarsSub",icon:"🏆",color:"var(--gold)",get:()=>DATA.top_stars||[],dk:null},
 {id:"newest",label:"newestTitle",sub:"newestSub",icon:"🛡️",color:"var(--green)",get:()=>DATA.newest||[],dk:null}
];
let currentView="trendingDaily";
function viewDef(id){
  if(id.startsWith("cat:")){const k=id.slice(4),m=CAT_META[k]||{icon:"•",color:"var(--accent)"};
    return{id,label:()=>t().cats[k],sub:()=>`${m.icon} ${k.toUpperCase()} · ${DATA.categories?.[k]?.length||0}`,icon:m.icon,color:m.color,get:()=>DATA.categories?.[k]||[],dk:null}}
  const b=BOARDS.find(x=>x.id===id)||BOARDS[0];
  return{...b,label:()=>t()[b.label],sub:()=>t()[b.sub]}
}
function renderRail(){const rail=$("#rail");if(!rail)return;
  const boardHtml=`<div class="rail-group"><div class="rail-label" data-i="railBoards">趋势榜单</div>`+BOARDS.map(b=>{
    const n=(b.get()||[]).length;return`<button class="rail-item ${currentView===b.id?"active":""}" style="--rc:${b.color}" data-view="${b.id}" aria-pressed="${currentView===b.id}"><span class="ri-ic">${b.icon}</span><span class="ri-name">${esc(t()[b.label])}</span><span class="ri-count">${n}</span></button>`}).join("")+`</div>`;
  const catHtml=`<div class="rail-group"><div class="rail-label" data-i="railCats">精选分类</div>`+CATS.map(k=>{
    const m=CAT_META[k],n=(DATA.categories?.[k]||[]).length;return`<button class="rail-item ${currentView==="cat:"+k?"active":""}" style="--rc:${m.color}" data-view="cat:${k}" aria-pressed="${currentView==="cat:"+k}"><span class="ri-ic">${m.icon}</span><span class="ri-name">${esc(t().cats[k])}</span><span class="ri-count">${n}</span></button>`}).join("")+`</div>`;
  rail.innerHTML=boardHtml+catHtml;
  rail.querySelectorAll(".rail-item").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
}
function setView(id){currentView=id;renderRail();renderStage();const l=$("#stageList");if(l)l.scrollTop=0}

function renderCards(el,repos,dk){
  if(!el)return;
  if(!Array.isArray(repos)||!repos.length){el.innerHTML=`<div class="empty">—</div>`;return}
  const frag=document.createDocumentFragment();
  repos.forEach((r,i)=>{
    const card=document.createElement("article");card.className="repo-card";card.tabIndex=0;card.setAttribute("role","button");
    card.setAttribute("aria-label",`${r.full_name}, ${fmt(r.stars)} stars`);
    const c=COLORS[r.language]||COLORS.default;
    const lang=r.language?`<span class="rc-lang" style="--lc:${c}"><i></i>${esc(r.language)}</span>`:"";
    const delta=(dk&&r[dk]>0)?`<span class="rc-delta">▲ +${fmt(r[dk])} ${dk==="period_stars"?t().today:t().week}</span>`:"";
    const topics=(r.topics||[]).slice(0,2).map(x=>`<span class="rc-topic">#${esc(x)}</span>`).join("");
    const zh=LANG==="zh"&&r.desc_zh?`<div class="rc-desc-zh">${esc(r.desc_zh)}</div>`:"";
    card.innerHTML=`<div class="rc-rank">${String(i+1).padStart(2,"0")}</div>
      <div class="rc-main">
        <div class="rc-top"><a class="rc-name" href="${esc(r.url||("https://github.com/"+r.full_name))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(r.full_name)}</a><span class="rc-stars">★ ${fmt(r.stars)}</span></div>
        <div class="rc-line2">${delta}<span class="rc-tag">${tagline(r)}</span></div>
        ${r.description?`<div class="rc-desc-en">${esc(r.description)}</div>`:""}
        ${zh}
        <div class="rc-meta">${lang}${topics}</div>
      </div>`;
    const nameEl=card.querySelector(".rc-name");
    if(nameEl){nameEl.addEventListener("mouseenter",()=>showHover(r.full_name,nameEl));nameEl.addEventListener("mouseleave",hideHover);nameEl.addEventListener("focus",()=>showHover(r.full_name,nameEl));nameEl.addEventListener("blur",hideHover)}
    const go=()=>openChart(r);
    card.addEventListener("click",go);
    card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}});
    frag.appendChild(card);
  });
  el.replaceChildren(frag);
}
function renderStage(){const v=viewDef(currentView),repos=v.get()||[];
  $("#stageTitle").textContent=v.label();
  $("#stageSub").textContent=v.sub();
  $("#stageCount").textContent=repos.length+" "+t().repos;
  const ic=$("#stageIcon");ic.textContent=v.icon;ic.style.color=v.color;
  renderCards($("#stageList"),repos,v.dk);
}
function renderKPIs(){
  let total=0,sum=0;const seen=new Set();
  ["trending_daily","trending_weekly","top_stars","newest"].forEach(k=>(DATA[k]||[]).forEach(r=>{if(!seen.has(r.full_name)){seen.add(r.full_name);total++;sum+=r.stars||0}}));
  Object.values(DATA.categories||{}).flat().forEach(r=>{if(!seen.has(r.full_name)){seen.add(r.full_name);total++;sum+=r.stars||0}});
  let rise=0;(DATA.trending_daily||[]).forEach(r=>{if((r.period_stars||0)>rise)rise=r.period_stars});
  const T=t();const items=[[T.kTotal,fmt(total),""],[T.kStars,fmt(sum),""],[T.kRise,rise?"+"+fmt(rise):"—",""],[T.kCats,String(CATS.length),""]];
  $("#kpis").innerHTML=items.map(([l,v,s])=>`<div class="kpi g"><div class="k-label">${esc(l)}</div><div class="k-val">${esc(v)}${s?`<small>${esc(s)}</small>`:""}</div></div>`).join("");
}
function renderAll(){renderKPIs();renderStage()}

/* 趋势图：hover 仓库名悬浮预览（主）+ 键盘/新标签查看（辅） */
const chartURL=full=>`https://api.star-history.com/svg?repos=${encodeURIComponent(full)}&type=Date`;
const chartCache={}; // full -> "ok" | "err"
function loadChartImg(full,body,tpl){
  body.innerHTML=`<div class="chart-placeholder">↻ ${LANG==="zh"?"加载中…":"Loading…"}</div>`;
  if(chartCache[full]==="err"){body.innerHTML=`<div class="chart-err">${LANG==="zh"?"图表暂不可用（可能限流）":"Chart unavailable (rate limit?)"}</div>`;return}
  const img=new Image();img.alt=full+" star history";img.className="chart-img";
  img.onload=()=>{chartCache[full]="ok";if(body.dataset.for!==full)return;body.innerHTML=tpl;$(".chart-frame",body)?$(".chart-frame",body).appendChild(img):body.appendChild(img)};
  img.onerror=()=>{chartCache[full]="err";if(body.dataset.for===full)body.innerHTML=`<div class="chart-err">${LANG==="zh"?"图表暂不可用（可能限流）":"Chart unavailable"}</div>`};
  img.src=chartURL(full);
}

let hoverTimer=null;
function showHover(full,anchor){
  const h=$("#hoverChart");if(!h)return;
  clearTimeout(hoverTimer);
  $("#hcName").textContent=full;
  const body=$("#hcBody");body.dataset.for=full;
  // 定位：优先显示在名字下方，空间不足则上方，水平不越界
  const r=anchor.getBoundingClientRect(),w=430,hgt=300,gap=10;
  let left=r.left,top=r.bottom+gap;
  if(left+w>window.innerWidth-12)left=window.innerWidth-w-12;
  if(left<12)left=12;
  if(top+hgt>window.innerHeight-12)top=r.top-hgt-gap;
  if(top<12)top=12;
  h.style.left=left+"px";h.style.top=top+"px";
  h.classList.add("show");h.setAttribute("aria-hidden","false");
  if(chartCache[full]==="ok"){
    const img=new Image();img.className="chart-img";img.alt=full+" star history";img.src=chartURL(full);
    body.innerHTML="";body.appendChild(img);
  }else loadChartImg(full,body,"");
}
function hideHover(){const h=$("#hoverChart");if(!h)return;hoverTimer=setTimeout(()=>{h.classList.remove("show");h.setAttribute("aria-hidden","true")},120)}
function renderModalInfo(r){
  const info=$("#modalInfo");if(!info)return;
  const full=r.full_name,url=r.url||("https://github.com/"+full),c=COLORS[r.language]||COLORS.default;
  const zh=LANG==="zh"&&r.desc_zh?`<div class="mi-desc-zh">${esc(r.desc_zh)}</div>`:"";
  const en=r.description?`<div class="mi-desc-en">${esc(r.description)}</div>`:(zh?"":"<div class='mi-empty'>—</div>");
  const lang=r.language?`<span class="s-lang" style="--lc:${c}"><i></i>${esc(r.language)}</span>`:"";
  const forks=r.forks!=null?`<span class="s-fork">⑂ ${fmt(r.forks)}</span>`:"";
  const topics=(r.topics||[]).slice(0,6).map(x=>`<span class="mi-topic">#${esc(x)}</span>`).join("");
  info.innerHTML=`<div class="mi-top">
      <span class="mi-name">${esc(full)}</span>
      <a class="mi-link" href="${esc(url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗ GitHub</a>
      <span class="mi-stats"><span class="s-star">★ ${fmt(r.stars)}</span>${forks}${lang}</span>
    </div>${zh}${en}
    <div class="mi-tags"><span class="mi-tag">${tagline(r)}</span>${topics}</div>`;
}
function openChart(r){
  const m=$("#chartModal");if(!m)return;
  const full=typeof r==="string"?r:(r.full_name||"");
  if(typeof r==="object")renderModalInfo(r);else{const info=$("#modalInfo");if(info)info.innerHTML=""}
  $("#chartRepo").textContent=full;
  $("#chartOpen").href="https://github.com/"+full;
  const body=$("#chartBody");body.dataset.for=full;
  loadChartImg(full,body,`<div class="chart-frame"></div>`);
  m.classList.add("open");m.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";
}
function closeChart(){const m=$("#chartModal");if(!m)return;m.classList.remove("open");m.setAttribute("aria-hidden","true");document.body.style.overflow=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeChart();const h=$("#hoverChart");if(h){h.classList.remove("show");h.setAttribute("aria-hidden","true")}}});
window.addEventListener("scroll",()=>{const h=$("#hoverChart");if(h&&h.classList.contains("show")){h.classList.remove("show");h.setAttribute("aria-hidden","true")}},{passive:true});

function updateStatus(){const st=$("#status"),txt=$("#statusText");if(!st||!txt)return;const m=st.dataset.mode;st.className="status"+(m==="warn"?" warn":"");txt.textContent=m==="live"?t().statusLive:(m==="warn"?t().statusWarn:t().statusSnap)}
function renderMeta(){const u=(DATA.updated_at||"").replace("T"," ").slice(0,16),ue=$("#updatedAt");if(ue)ue.textContent=t().updated+": "+u;const g=DATA.growth_7d||{},n=Object.keys(g).length,gi=$("#growthInfo");if(gi)gi.textContent=n>0?t().growth(n):t().growth0;$("#status").dataset.mode="snap";updateStatus()}

const LIVE=/^https?:$/.test(location.protocol)&&!/^(127\.|localhost|0\.0\.0\.0)/.test(location.hostname||"");
async function ghSearch(q,n=15){const r=await fetch(`https://api.github.com/search/repositories?q=${encodeURIComponent(q)}&sort=stars&order=desc&per_page=${n}`,{headers:{Accept:"application/vnd.github+json"}});if(!r.ok)throw new Error("gh "+r.status);const j=await r.json();return(j.items||[]).map(it=>({full_name:it.full_name,description:it.description||"",language:it.language||"",stars:it.stargazers_count||0,forks:it.forks_count||0,url:it.html_url,desc_zh:"",topics:(it.topics||[]).slice(0,5)}))}
const mergeRepos=(a,b)=>{const s=new Set(a.map(r=>r.full_name));return[...a,...b.filter(r=>!s.has(r.full_name))].sort((x,y)=>y.stars-x.stars).slice(0,25)};
function toast(msg){const b=$("#liveBar");b.textContent=msg;b.style.display="block"}
async function liveRefresh(manual=false){const btn=$("#refreshBtn");if(btn)btn.disabled=true;
  try{toast(LANG==="zh"?"⚡ 正在从 GitHub 实时刷新…":"⚡ Refreshing from GitHub…");
    const since=new Date(Date.now()-14*864e5).toISOString().slice(0,10);
    const[top,newest,texts,ai,dev,life,fin]=await Promise.all([
      ghSearch("stars:>10000",25),ghSearch(`created:>${since} stars:>50`,25),
      ghSearch("topic:awesome stars:>500",15).then(a=>ghSearch("topic:tutorial stars:>500",15).then(b=>mergeRepos(a,b))),
      ghSearch("topic:ai stars:>500",15).then(a=>ghSearch("topic:llm stars:>500",15).then(b=>mergeRepos(a,b))),
      ghSearch("topic:developer-tools stars:>500",15).then(a=>ghSearch("topic:cli stars:>500",15).then(b=>mergeRepos(a,b))),
      ghSearch("topic:psychology stars:>500",15).then(a=>ghSearch("topic:self-improvement stars:>500",15).then(b=>mergeRepos(a,b))),
      ghSearch("topic:quantitative-finance stars:>500",15).then(a=>ghSearch("topic:trading stars:>500",15).then(b=>mergeRepos(a,b)))]);
    DATA.top_stars=top;DATA.newest=newest;DATA.categories={texts,ai,dev,life,finance:fin};DATA.updated_at=new Date().toISOString();
    renderAll();renderRail();renderMeta();$("#status").dataset.mode="live";updateStatus();
    toast((LANG==="zh"?"⚡ 已实时刷新榜单与分类":"⚡ Refreshed boards & categories")+" · "+new Date().toLocaleTimeString());
    try{localStorage.setItem("gh_radar_last_live",Date.now())}catch(e){}
  }catch(e){$("#status").dataset.mode="warn";updateStatus();toast(LANG==="zh"?"⚡ 实时刷新未成功（GitHub 限额？），当前显示本地快照":"⚡ Live refresh failed (rate limit?), showing local snapshot")}
  finally{if(btn)btn.disabled=false;setTimeout(()=>{const b=$("#liveBar");if(b)b.style.display="none"},manual?5000:4000)}}

function init(){
  try{LANG=localStorage.getItem("gh_radar_lang")||"zh"}catch(e){}
  $("#langBtn").textContent=LANG==="zh"?"🌐 中文":"🌐 English";
  let saved=null;try{saved=localStorage.getItem("gh_radar_theme")}catch(e){}
  const systemDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(saved||(systemDark?"dark":"light"),false);
  applyI18n();renderMeta();renderRail();renderAll();
  if(LIVE){let last=0;try{last=+localStorage.getItem("gh_radar_last_live")||0}catch(e){}
    if(Date.now()-last>3*3600*1000)setTimeout(()=>liveRefresh(false),1200);else{$("#status").dataset.mode="snap";updateStatus()}}
}
document.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
